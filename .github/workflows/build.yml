name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libltdl-dev ffmpeg libsdl2-dev openjdk-17-jdk git zip unzip build-essential autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev

    - name: Configure Git and Buffer
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git config --global url."https://github.com/".insteadOf git@github.com:
        git config --global http.postBuffer 1048576000
        git config --global safe.directory '*'

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0" buildozer

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUM: "true"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: antrax-apk
        path: bin/*.apk
