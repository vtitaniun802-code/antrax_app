name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0" buildozer

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libltdl-dev ffmpeg libsdl2-dev openjdk-17-jdk

    - name: Accept Android SDK Licenses & Build
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer -v android debug
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUM: "true"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: antrax-apk
        path: bin/*.apk
